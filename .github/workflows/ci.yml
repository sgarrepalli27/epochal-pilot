name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # Windows on ARM64 (e.g. Surface Pro with Snapdragon X)
          - os: windows-11-arm
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Dry run (offline, no keys)
        run: |
          epochal-pilot list
          epochal-pilot check
          epochal-pilot run fed-rates --dry-run --limit 3 --out runs/ci-fed
          epilot run future-leak --dry-run --limit 3 --out runs/ci-leak
          epochal-pilot run fed-rates --estimate
          epochal-pilot run fed-rates --dry-run --context public --out runs/ci-pub
          epochal-pilot report runs/ci-fed --share
          epochal-pilot compare runs/ci-pub runs/ci-fed --out runs/ci-compare
          epochal-pilot validate fed-rates
          epochal-pilot validate future-leak
          epochal-pilot plan fed-rates --requests 20
